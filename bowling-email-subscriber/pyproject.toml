[project]
name = "bowling-email-subscriber"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "google-api-python-client>=2.200.0",
    "google-auth-httplib2>=0.4.2",
    "google-auth-oauthlib>=1.4.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyrefly>=1.3.1",
    "ruff>=0.16.7",
    "tool>=0.8.0",
]

[tool]

[tool.ruff]
src = ["."]

[tool.ruff.lint]
extend-select = ["I"]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
